# =============================================================================
#  alvi_rnaome.yml — These are the actual project parameters
#  (Apis mellifera transmissible RNAome, RJ/ST manuscript dataset)
#
#  Run with:
#    bash run.sh --params-file config/params/alvi_rnaome.yml
#    (or directly: nextflow run main.nf -profile cambridge
#       -params-file config/params/alvi_rnaome.yml --partition ... --project ...)
#
#  Layers on top of the pipeline's own default params (params.config, always
#  loaded) — only values that differ for this project need to be here.
#  Nextflow only allows one -params-file per run, and it always overrides
#  params.config's params {} block regardless of command-line order, so this
#  file only needs to list what's actually different — the pipeline itself
#  stays generic and reusable, and this file documents the exact paths and
#  tool parameters actually used for the published analysis.
#
# =============================================================================

# ── Samples ──────────────────────────────────────────────────────────────────
#
# Point this at the real sample sheet for this project — see samples.csv format in the pipeline README).
#
sample_sheet: "<path/to/your/real/samples.csv>"

# ── Genome & annotation references ──────────────────────────────────────────

# Apis mellifera (honeybee host genome) — RefSeq assembly GCF_003254395.2,
# Amel_HAv3.1. STAR index confirmed already built (SA, SAindex, sjdb* etc.
# present) at:
star_genome_dir: "/home/nv358/rds/hpc-work/transmissible_RNA/refs/ncbi_dataset/data/GCF_003254395.2"
# GTF the index above was built from:
star_gtf: "/home/nv358/rds/hpc-work/transmissible_RNA/refs/ncbi_dataset/data/GCF_003254395.2/genomic.gtf"
# Same assembly, plain genome FASTA — a separate copy used as a bbsplit
# reference (not the STAR index itself):
apis_mellifera_genome_fasta: "/home/nv358/rds/rds-apis-mellifera-7BbYnVDdZgw/transmissible_RNAome/in/ref_genomes/apis_mellifera_genome/data/GCF_003254395.2/GCF_003254395.2_Amel_HAv3.1_genomic.fna"

# Human genome — Ensembl GRCh38 primary assembly (host/contaminant
