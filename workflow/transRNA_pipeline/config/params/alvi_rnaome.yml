# ── TrimGalore — actual project run (pipeline itself uses tool defaults) ─────
# Verified 2026-08-26 against the trimming_report.txt in
# scripts/nextflow/nf-core_rnaseq/out/all_samples_run_Dec_24/trimgalore/
# (RJ1_trimmed_1.fastq.gz_trimming_report.txt etc.) — this is the pass whose
# output (.../trimgalore/rest/*_val_*.fq.gz) directly fed the verified STAR
# run above, and the same values are recorded in a second, independent copy
# under out/new_manual_run/trimgalore/. One caveat: this confirms the
# reported *settings*, not a captured log of the pair-validation step
# actually enforcing 15bp (unlike the earlier raw-pass check) — the
# underlying Nextflow work directories appear to no longer exist.
#
#   --quality 20               Phred quality cutoff
#   -a AGATCGGAAGAGC            adapter (read 1)
#   -a2 GATCGTCGGACT            adapter (read 2)
#   -e 0.1                      max trimming error rate (10%)
#   --stringency 1              min adapter-overlap (bp) required to trim
#   --length 15                 discard a read pair if either read is <15bp
#                                after trimming (params.config's own generic
#                                default is 20 — overridden below)
#   --trim-n                    remove Ns from the start/end of reads
#
# quality/stringency happen to already match params.config's own tool-default
# values, but are restated here for a complete, self-contained record of
# what was actually run.
trim_quality:     20
trim_stringency:  1
trim_length:      15
trim_extra_args: "-a AGATCGGAAGAGC -a2 GATCGTCGGACT --trim-n"

# ── STAR — actual project run (pipeline itself uses structural defaults) ─────

star_extra_args: >-
  --alignEndsType EndToEnd
  --outFilterMismatchNmax 2
  --outFilterMultimapNmax 1000
  --outFilterMultimapScoreRange 0
  --outFilterMatchNmin 16
  --outFilterScoreMinOverLread 0
  --outFilterMatchNminOverLread 0
  --alignIntronMax 0
  --alignSJDBoverhangMin 3
  --alignTranscriptsPerReadNmax 100000
  --quantMode TranscriptomeSAM GeneCounts
  --outSAMunmapped Within
  --outSAMattributes NH HI AS nM
  --outWigType wiggle
  --outWigStrand Stranded
  --outWigNorm RPM
