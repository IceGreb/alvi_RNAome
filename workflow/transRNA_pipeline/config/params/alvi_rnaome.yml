# Varroa destructor (honeybee parasitic mite) — found used alongside human
# and viral references in the real bbsplit host-decontamination step
# (scripts/slurm/bbsplit_NEW.sh). Not previously in params.config — flagging in
# case the pipeline's own decontamination step should include it too:
varroa_genome_fasta: "/home/nv358/rds/rds-apis-mellifera-7BbYnVDdZgw/varroa_davide/old/varroa_destructor_genome/data/GCF_002443255.2/GCF_002443255.2_Vdes_3.0_genomic.fna"

# 12 honeybee viral genomes (BBsplit antiviral decontamination — "Decon-b" in
# the aggregate report). Combined fasta (confirmed exists) + the directory of
# individual per-virus files it's built from (ABPV, BMLV, BQCV-IT1, CBPV,
# DWV, IAPV, KBV, LSV [1-4 + all], SBPV, SBV, VDV-1):
viral_genomes_fasta: "/home/nv358/rds/rds-apis-mellifera-7BbYnVDdZgw/transmissible_RNAome/in/ref_genomes/honeybee_viruses/all_viral_genomes.fna"
viral_genomes_dir:   "/home/nv358/rds/rds-apis-mellifera-7BbYnVDdZgw/transmissible_RNAome/in/ref_genomes/honeybee_viruses"

# Invertebrate phyla exclusion list (filter_kraken_invertebrates.py /
