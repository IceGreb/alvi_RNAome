# R scripts using ggplot2 for plotting (plot_lengths_R.R and friends):
# ggplot2/dplyr/purrr/magrittr/scales/reshape2/data.table for the usual
# fread -> normalise -> full_join -> rowMeans -> melt -> geom_line pipeline,
# svglite for text-preserving SVG output (base grDevices::svg is Cairo-backed
# and always outlines text into paths instead).
channels:
  - conda-forge
dependencies:
  - r-base=4.3
  - r-ggplot2=3.5.1
  - r-dplyr=1.1.4
  - r-purrr=1.0.2
  - r-magrittr=2.0.3
  - r-scales=1.3.0
  - r-reshape2=1.4.4
  - r-data.table=1.15.4
  - r-svglite=2.1.3
